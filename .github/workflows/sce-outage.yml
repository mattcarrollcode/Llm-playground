name: SCE outage 800588256

on:
  push:
    branches: [main]
    paths:
      - 'sce-outage/**'
      - '.github/workflows/sce-outage.yml'
  schedule:
    # Hourly at :17 UTC. GitHub can delay scheduled workflow starts.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sce-outage-800588256
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile sce-outage/monitor.py
      - name: Query SCE outages near private address and log changes
        env:
          SCE_SERVICE_ADDRESS: ${{ secrets.SCE_SERVICE_ADDRESS }}
          SCE_SEARCH_RADIUS_MILES: '3'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python sce-outage/monitor.py --github
